<form class="form export-form" method="post" action="{{ url_for('export_plot') }}" data-export-form>
  <input type="hidden" name="preview_id" value="{{ preview_id }}">
  <label>
    Current folder
    <input name="directory" type="text" value="{{ current_path }}">
  </label>

  <div class="section-head preview-head">
    <div>
      <h2>Save plot</h2>
      <p>Browse the filesystem and choose where the PNG should be written.</p>
    </div>
    {% if parent_path %}
      <a class="button" href="{{ url_for('plot_export_dialog', preview_id=preview_id, path=parent_path) }}" data-browse-link>Up</a>
    {% endif %}
  </div>

  <div class="list compact export-browser">
    {% for entry in entries %}
      <div class="row">
        <strong>{{ entry.name }}</strong>
        {% if entry.is_dir %}
          <a class="button" href="{{ url_for('plot_export_dialog', preview_id=preview_id, path=entry.path) }}" data-browse-link>Open</a>
        {% else %}
          <span>File</span>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  <label>
    Filename
    <input name="filename" type="text" value="combined.png">
  </label>
  <label class="inline-check">
    <input name="overwrite" type="checkbox" value="1">
    <span>Overwrite existing file</span>
  </label>
  <p data-export-status></p>
  <div class="actions">
    <button class="button primary" type="submit">Save plot</button>
    <button class="button" type="button" data-close-export>Cancel</button>
  </div>
</form>
