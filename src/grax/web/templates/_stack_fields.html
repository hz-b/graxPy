    <fieldset>
      <legend>Substrate</legend>
      <label>Substrate
        <input name="substrate_material" list="material-suggestions" value="{{ defaults.substrate_material|default('', true) }}" data-material-select="substrate_material" autocomplete="off">
      </label>
      <label>Substrate density, g/cm^3
        <input name="substrate_material_density_g_cm3" type="number" step="any" value="{{ defaults.substrate_material_density_g_cm3 }}" placeholder="{{ density_placeholders['substrate_material'] }}" data-material-density="substrate_material">
      </label>
      <label>Substrate roughness &sigma;, nm <input name="substrate_roughness_sigma_nm" type="number" step="0.01" min="0" value="{{ defaults.substrate_roughness_sigma_nm }}"></label>
    </fieldset>

    <fieldset>
      <legend>Layer stack</legend>
      <label>Stack type
        <select name="stack_type" data-stack-type>
          <option value="single_layer" {% if defaults.stack_type == "single_layer" %}selected{% endif %}>Single layer</option>
          <option value="multilayer" {% if defaults.stack_type == "multilayer" %}selected{% endif %}>Multilayer</option>
        </select>
      </label>
      <fieldset data-single-layer-controls>
        <legend>Single layer</legend>
        <label>Layer material
          <input name="layer_material" list="material-suggestions" value="{{ defaults.layer_material|default('', true) }}" data-material-select="layer_material" autocomplete="off">
        </label>
        <label>Layer density, g/cm^3
          <input name="layer_material_density_g_cm3" type="number" step="any" value="{{ defaults.layer_material_density_g_cm3 }}" placeholder="{{ density_placeholders['layer_material'] }}" data-material-density="layer_material">
        </label>
        <label>Layer thickness, nm <input name="layer_thickness_nm" type="number" step="0.01" value="{{ defaults.layer_thickness_nm }}"></label>
        <label>Layer roughness &sigma;, nm <input name="layer_roughness_sigma_nm" type="number" step="0.01" min="0" value="{{ defaults.layer_roughness_sigma_nm }}"></label>
      </fieldset>

      <fieldset data-stack-controls>
        <legend>Multilayer stack</legend>
        <label>Material A
          <input name="material_a" list="material-suggestions" value="{{ defaults.material_a|default('', true) }}" data-material-select="material_a" autocomplete="off">
        </label>
        <label>Material A density, g/cm^3
          <input name="material_a_density_g_cm3" type="number" step="any" value="{{ defaults.material_a_density_g_cm3 }}" placeholder="{{ density_placeholders['material_a'] }}" data-material-density="material_a">
        </label>
        <label>Material A roughness &sigma;, nm <input name="material_a_roughness_sigma_nm" type="number" step="0.01" min="0" value="{{ defaults.material_a_roughness_sigma_nm }}"></label>
        <label>Material B
          <input name="material_b" list="material-suggestions" value="{{ defaults.material_b|default('', true) }}" data-material-select="material_b" autocomplete="off">
        </label>
        <label>Material B density, g/cm^3
          <input name="material_b_density_g_cm3" type="number" step="any" value="{{ defaults.material_b_density_g_cm3 }}" placeholder="{{ density_placeholders['material_b'] }}" data-material-density="material_b">
        </label>
        <label>Material B roughness &sigma;, nm <input name="material_b_roughness_sigma_nm" type="number" step="0.01" min="0" value="{{ defaults.material_b_roughness_sigma_nm }}"></label>
        <label>Bilayer period, nm <input name="d_period_nm" type="number" step="0.01" value="{{ defaults.d_period_nm }}"></label>
        <label>Gamma <input name="gamma" type="number" step="0.01" value="{{ defaults.gamma }}"></label>
        <label>Bilayers <input name="n_bilayers" type="number" step="1" value="{{ defaults.n_bilayers }}"></label>
        <label>Top material
          <input name="top_material" list="material-suggestions" value="{{ defaults.top_material|default('', true) }}" data-material-select="top_material" autocomplete="off">
        </label>
        <label>Top material density, g/cm^3
          <input name="top_material_density_g_cm3" type="number" step="any" value="{{ defaults.top_material_density_g_cm3 }}" placeholder="{{ density_placeholders['top_material'] }}" data-material-density="top_material">
        </label>
      </fieldset>
    </fieldset>

    <fieldset>
      <legend>Top cap</legend>
      <label>Top cap material
        <input name="top_cap_material" list="material-suggestions" value="{{ defaults.top_cap_material|default('', true) }}" data-material-select="top_cap_material" autocomplete="off">
      </label>
      <label>Top cap density, g/cm^3
        <input name="top_cap_material_density_g_cm3" type="number" step="any" value="{{ defaults.top_cap_material_density_g_cm3 }}" placeholder="{{ density_placeholders['top_cap_material'] }}" data-material-density="top_cap_material">
      </label>
      <label>Top cap thickness, nm <input name="top_cap_thickness_nm" type="number" step="0.01" value="{{ defaults.top_cap_thickness_nm }}"></label>
      <label>Top cap roughness &sigma;, nm <input name="top_cap_roughness_sigma_nm" type="number" step="0.01" min="0" value="{{ defaults.top_cap_roughness_sigma_nm }}"></label>
    </fieldset>
