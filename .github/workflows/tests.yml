name: tests

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Run unit and smoke tests
        run: >
          uv run pytest tests/unit tests/smoke
          -m "not browser"
          --ignore=tests/unit/test_reticolopy_opt.py
          --cov=grax --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      GRAX_TEST_ARTIFACTS: test-results/browser
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run browser and real-scan checks
        run: uv run pytest tests/smoke/test_web_browser.py -m browser -v --junitxml=browser-results.xml

      - name: Annotate browser failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("browser-results.xml")
          if report.exists():
              for case in ElementTree.parse(report).iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      detail = (failure.get("message") or "Browser test failed").splitlines()[0]
                      print(f"::error file=tests/smoke/test_web_browser.py::{case.get('name')}: {detail}")
          PY

      - name: Upload browser failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/browser/
          if-no-files-found: warn
